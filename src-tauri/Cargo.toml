[package]
name = "folderai"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
flate2 = "1"
notify = "8.2.2"
rawzip = "0.5.2"
zip = { version = "9.8.0", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.43.0", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "FoundationErrors", "NSArray", "NSBundle", "NSError", "NSFileManager", "NSString", "NSURL"] }
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
